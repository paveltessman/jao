version: "2"
sql:
  - engine: sqlite
    schema: db/migrations/sql
    queries:
    gen:
      go:
        package: sqlc
        out: db/internal/sqlc
        output_db_file_name: db_sqlc.go
        output_models_file_name: models_sqlc.go
        output_files_suffix: _sqlc
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: uuid
              type: UUID
              pointer: true
